name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    name: Validate project and PostgreSQL 17
    runs-on: ubuntu-latest
    timeout-minutes: 35

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: seduc
          POSTGRES_PASSWORD: ci-test-password
          POSTGRES_DB: seduc_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U seduc -d seduc_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_TEST_URL: postgresql://seduc:ci-test-password@localhost:5432/seduc_test?schema=public
      DATABASE_TEST_ALLOW_RESET: 'true'
      SESSION_SECRET: ci-only-session-secret-with-at-least-32-characters
      SESSION_TTL_HOURS: 8

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm db:generate

      - name: Validate Prisma schema
        run: pnpm db:validate

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Test PostgreSQL migrations and constraints
        run: pnpm --filter @seduc/database test:integration

      - name: Test API PostgreSQL integration
        run: pnpm --filter @seduc/api test:integration

      - name: Test PostgreSQL 17 backup and restoration
        env:
          POSTGRES_TOOLS_CONTAINER: ${{ job.services.postgres.id }}
          POSTGRES_USER: seduc
          POSTGRES_PASSWORD: ci-test-password
          SOURCE_DATABASE: seduc_test
          RESTORE_DATABASE: seduc_restore_test
        run: bash scripts/test-backup-restore.sh

      - name: Validate production Compose
        env:
          CORS_ORIGIN: https://seduc.example.invalid
          POSTGRES_PASSWORD: ci-compose-only-password
          SESSION_SECRET: ci-compose-only-session-secret-with-at-least-32-characters
        run: docker compose -f compose.production.yaml config --quiet

      - name: Build production images
        run: |
          docker build --file docker/api.Dockerfile --target production --tag seduc-api:ci .
          docker build --file docker/web.Dockerfile --target production --tag seduc-web:ci .

      - name: Validate operational shell scripts
        run: bash -n scripts/backup-postgres.sh scripts/restore-postgres.sh scripts/test-backup-restore.sh
