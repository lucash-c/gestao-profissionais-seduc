<!-- Formulário -->
<form class="space-y-space-lg" onsubmit="event.preventDefault();">
<!-- Campo: Login / Email -->
<div>
<label class="block font-label-md text-label-md text-on-surface mb-space-xs" for="identificador">
                Login ou e-mail
              </label>
<div class="relative flex items-center">

<input autocomplete="username" class="w-full h-10 pl-11 pr-space-md bg-surface-container-low text-on-surface font-body-md text-body-md rounded placeholder:text-outline focus:bg-surface-container-lowest focus:outline-none focus:ring-2 focus:ring-primary transition-all duration-150" id="identificador" name="identificador" placeholder="Ex: carlos.eduardo ou nome@educamericana.sp.gov.br" required="" type="text">

</div>
</div>

</div>
</div>
</div>
</div>
<script>
  (function() {
    const toggleBtn = document.getElementById('toggle-password');
    const pwdInput = document.getElementById('senha');
    const eyeIcon = document.getElementById('eye-icon');

    if (toggleBtn && pwdInput && eyeIcon) {
      toggleBtn.addEventListener('click', function() {
        const isPassword = pwdInput.getAttribute('type') === 'password';
        pwdInput.setAttribute('type', isPassword ? 'text' : 'password');
        eyeIcon.textContent = isPassword ? 'visibility_off' : 'visibility';
      });
    }
  })();
