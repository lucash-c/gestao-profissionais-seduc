name: seduc-americana-production

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-seduc}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_USER: ${POSTGRES_USER:-seduc}
    volumes:
      - postgres_production_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  migrate:
    image: seduc-api:${APP_VERSION:-latest}
    build:
      context: .
      dockerfile: docker/api.Dockerfile
      target: production
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-seduc}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@db:5432/${POSTGRES_DB:-seduc}?schema=public
    command: ['pnpm', '--filter', '@seduc/database', 'db:migrate:deploy']
    restart: 'no'
    depends_on:
      db:
        condition: service_healthy

  api:
    image: seduc-api:${APP_VERSION:-latest}
    build:
      context: .
      dockerfile: docker/api.Dockerfile
      target: production
    restart: unless-stopped
    environment:
      API_PORT: 3000
      CORS_ORIGIN: ${CORS_ORIGIN:?CORS_ORIGIN is required}
      DATABASE_URL: postgresql://${POSTGRES_USER:-seduc}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@db:5432/${POSTGRES_DB:-seduc}?schema=public
      LOG_LEVEL: ${LOG_LEVEL:-info}
      NODE_ENV: production
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET is required}
      SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:-8}
      TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-1}
    expose:
      - '3000'
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3000/health/ready').then((response)=>{if(!response.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  web:
    image: seduc-web:${APP_VERSION:-latest}
    build:
      context: .
      dockerfile: docker/web.Dockerfile
      target: production
      args:
        VITE_API_BASE_URL: /api
    restart: unless-stopped
    ports:
      - '${WEB_BIND_ADDRESS:-127.0.0.1}:${WEB_PORT:-8080}:80'
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - wget --quiet --tries=1 --spider http://127.0.0.1/health || exit 1
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  postgres_production_data:
