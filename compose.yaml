name: seduc-americana

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-seduc}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-before-use}
      POSTGRES_USER: ${POSTGRES_USER:-seduc}
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init-test-db.sql:/docker-entrypoint-initdb.d/10-init-test-db.sql:ro
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
      target: development
    restart: unless-stopped
    environment:
      API_PORT: 3000
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:9000}
      DATABASE_URL: postgresql://${POSTGRES_USER:-seduc}:${POSTGRES_PASSWORD:-change-me-before-use}@db:5432/${POSTGRES_DB:-seduc}?schema=public
      DATABASE_TEST_URL: postgresql://${POSTGRES_USER:-seduc}:${POSTGRES_PASSWORD:-change-me-before-use}@db:5432/seduc_test?schema=public
      LOG_LEVEL: ${LOG_LEVEL:-info}
      NODE_ENV: development
    ports:
      - '127.0.0.1:${API_PORT:-3000}:3000'
    volumes:
      - ./apps/api/src:/workspace/apps/api/src:ro
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3000/health/ready').then((response)=>{if(!response.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
      target: development
    restart: unless-stopped
    environment:
      VITE_API_BASE_URL: /api
      VITE_API_PROXY_TARGET: http://api:3000
    ports:
      - '127.0.0.1:${WEB_PORT:-9000}:9000'
    volumes:
      - ./apps/web/src:/workspace/apps/web/src:ro
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:9000').then((response)=>{if(!response.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  postgres_data:
